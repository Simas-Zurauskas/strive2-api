version: 0.2

# Builds the Strive API for the CodePipeline EB Deploy action. node_modules
# excluded from the artifact — EB installs fresh on the arm64 Graviton
# instance so native bindings match the host arch.

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
      - yarn --version
  pre_build:
    commands:
      - yarn install --frozen-lockfile
  build:
    commands:
      - yarn build

artifacts:
  files:
    - build/**/*
    - fonts/**/*
    - package.json
    - yarn.lock
    - Procfile
    - .platform/**/*
    - .ebextensions/**/*
  discard-paths: no
  name: strive-api

cache:
  paths:
    - node_modules/**/*
