version: 0.2

# Builds the Strive API for the CodePipeline EB Deploy action. node_modules
# excluded from the artifact — EB installs fresh on the arm64 Graviton
# instance so native bindings match the host arch.

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
      - yarn --version
  pre_build:
    commands:
      - yarn install --frozen-lockfile
      # Fail fast on type errors or broken tests before the production
      # emit step — CodeBuild minutes are cheaper than a broken deploy.
      - yarn tsc
      - yarn test
  build:
    commands:
      - yarn build
      # EB refuses to run a .platform hook that isn't executable, and a lost
      # mode bit is silent — the hook is simply skipped and the instance comes
      # up without Caddy. Git already stores these 755; this is belt-and-braces
      # against the checkout or the artifact zip dropping the bit.
      - chmod +x .platform/hooks/*/*.sh .platform/confighooks/*/*.sh .platform/caddy/*.sh

artifacts:
  files:
    - build/**/*
    - fonts/**/*
    - package.json
    - yarn.lock
    - Procfile
    - .platform/**/*
    - .ebextensions/**/*
  discard-paths: no
  name: strive-api

cache:
  paths:
    - node_modules/**/*
